  <line x1="25" y1="15.5" x2="19" y2="15.5" stroke="#666" stroke-width="0.5"/>
  <!-- Tail -->
  <path d="M25 26 Q30 22 28 18 Q27 16 25 18" stroke="#111" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <circle cx="16" cy="13" r="7.5" fill="#111"/>
  <!-- Left ear -->
  <polygon points="8,8 6,2 12,7" fill="#111"/>
  <!-- Right ear -->
  <polygon points="24,8 26,2 20,7" fill="#111"/>
